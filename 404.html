<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Mistvale Tea Co.</title>
  <meta name="description" content="The page you asked for could not be found. Explore Mistvale's tea collection instead.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f6f1e7 0%, #ebe2cf 100%);
    }

    .not-found-wrap {
      width: min(720px, calc(100vw - 32px));
      background: rgba(255,255,255,0.52);
      border: 1px solid rgba(31,61,43,0.08);
      border-radius: 20px;
      box-shadow: 0 18px 46px rgba(17,22,18,0.12);
      padding: 36px 28px;
      text-align: center;
    }

    .not-found-code {
      display: inline-block;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 1;
      color: var(--tea-green);
      font-family: 'Fraunces', Georgia, serif;
      margin-bottom: 12px;
    }

    .not-found-wrap h1 {
      margin-bottom: 12px;
    }

    .not-found-wrap p {
      max-width: 560px;
      margin: 0 auto 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="not-found-wrap">
    <div class="not-found-code">404</div>
    <h1>That page is not on the tea trail.</h1>
    <p>The page you’re looking for may have moved or may not exist. Head back to the Mistvale tea collection and pick a new favourite.</p>
    <a class="btn" href="index.html">Return to the shop</a>
  </main>
</body>
</html>
